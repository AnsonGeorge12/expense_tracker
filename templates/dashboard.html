<!DOCTYPE html>
<html>
<head>
    <title>My Dashboard</title>
</head>
<body style="font-family: Arial; margin: 30px; background-color: #f9f9f9;">

    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>My Expense Dashboard</h1>
        <a href="/logout" style="color: red; text-decoration: none; font-weight: bold;">Logout</a>
    </div>
    <hr>

    <div style="background: #007BFF; color: white; padding: 20px; border-radius: 10px; display: inline-block; margin-bottom: 20px; min-width: 200px;">
        <h3 style="margin: 0; font-size: 16px; opacity: 0.9;">Total Expenses</h3>
        <p style="margin: 5px 0 0 0; font-size: 28px; font-weight: bold;">${{ "{:,.2f}".format(total) }}</p>
    </div>

    <div style="background: white; padding: 20px; border-radius: 10px; border: 1px solid #ddd;">
        <h3>Add New Expense</h3>
        <form action="/add" method="POST">
            <input type="text" name="item" placeholder="Item Name" required style="padding: 8px;">
            <input type="number" step="0.01" name="amount" placeholder="Amount" required style="padding: 8px;">
            <input type="text" name="category" placeholder="Category" style="padding: 8px;">
            <button type="submit" style="padding: 8px 15px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">
                Add Expense
            </button>
        </form>

        <br>
        <table border="1" width="100%" style="border-collapse: collapse; text-align: left;">
            <tr style="background: #eee;">
                <th style="padding: 12px;">Item</th>
                <th style="padding: 12px;">Amount</th>
                <th style="padding: 12px;">Category</th>
            </tr>
            {% for row in expenses %}
            <tr>
                <td style="padding: 10px; border-bottom: 1px solid #eee;">{{ row[2] }}</td>
                <td style="padding: 10px; border-bottom: 1px solid #eee;">${{ "{:,.2f}".format(row[3]) }}</td>
                <td style="padding: 10px; border-bottom: 1px solid #eee;">{{ row[4] }}</td>
            </tr>
            {% endfor %}
        </table>
        
        {% if not expenses %}
        <p style="text-align: center; color: #888; margin-top: 20px;">No expenses found. Start by adding one above!</p>
        {% endif %}
    </div>

</body>
</html>
