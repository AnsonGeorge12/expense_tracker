<!DOCTYPE html>
<html>
<head><title>Login - Expense Tracker</title></head>
<body style="text-align:center; font-family: Arial; padding-top: 50px; background-color: #f4f4f9;">
    
    <div style="display:inline-block; background: white; border:1px solid #ddd; padding:30px; border-radius:12px; width: 300px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1);">
        <h2>💰 Login</h2>
        
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Username" required style="width:90%; padding:10px;"><br><br>
            <input type="password" name="password" placeholder="Password" required style="width:90%; padding:10px;"><br><br>
            <button type="submit" style="width:97%; padding:10px; background:#007BFF; color:white;">Login</button>
        </form>

        <hr>

        <h4>New User?</h4>
        <form action="/register" method="POST">
            <input type="text" name="username" placeholder="New Username" required style="width:90%; padding:8px;"><br><br>
            <input type="password" name="password" placeholder="New Password" required style="width:90%; padding:8px;"><br><br>
            <button type="submit" style="width:97%; padding:8px; background:#28a745; color:white;">Create Account</button>
        </form>
    </div>

</body>
</html>
